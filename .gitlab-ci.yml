    - apt-get update && apt-get install -y libpq-dev gcc
    - pip install -r requirements.txt || true
  script:
    - mkdir -p artifacts/scan-after
    - pip-audit -f json -o artifacts/scan-after/pip-audit.json || true
  artifacts:
    when: always
    paths:
